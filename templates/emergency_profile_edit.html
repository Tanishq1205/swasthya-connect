{% extends 'base.html' %}
{% block content %}
<div class="max-w-lg mx-auto bg-white p-6 rounded-xl border shadow-sm">
    <h1 class="text-xl font-bold text-gray-900 mb-1">Setup Emergency Profile</h1>
    <p class="text-xs text-gray-500 mb-6">This information will be displayed on the Emergency Assist screen during critical situations.</p>

    <form method="POST" action="/emergency-profile" class="space-y-4 text-sm">
        <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Emergency Contact Name</label>
            <input type="text" name="emergency_contact_name" value="{{ profile['emergency_contact_name'] if profile else '' }}" class="w-full border rounded px-3 py-2" placeholder="e.g. Parent / Spouse / Neighbor">
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Emergency Contact Phone</label>
            <input type="text" name="emergency_contact_phone" value="{{ profile['emergency_contact_phone'] if profile else '' }}" class="w-full border rounded px-3 py-2" placeholder="e.g. 9876543210">
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Blood Group</label>
                <input type="text" name="blood_group" value="{{ profile['blood_group'] if profile else '' }}" class="w-full border rounded px-3 py-2" placeholder="e.g. O+, B+, AB-">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Allergies (if any)</label>
                <input type="text" name="allergies" value="{{ profile['allergies'] if profile else '' }}" class="w-full border rounded px-3 py-2" placeholder="e.g. Penicillin, Peanuts">
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Current Medications / Medical Conditions</label>
            <textarea name="medications" rows="2" class="w-full border rounded px-3 py-2" placeholder="e.g. Diabetic, Asthma, Hypertension">{{ profile['medications'] if profile else '' }}</textarea>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded transition">
            Save Emergency Profile
        </button>
    </form>
</div>
{% endblock %}
