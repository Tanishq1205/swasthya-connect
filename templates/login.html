{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-lg border shadow-sm mt-8">
    <h2 data-key="auth_login_title" class="text-2xl font-bold text-gray-900 mb-4 text-center">Citizen Login</h2>
    <form method="POST" action="/login" class="space-y-4">
        <div>
            <label data-key="auth_phone_label" class="block text-xs font-semibold text-gray-700 uppercase mb-1">10-Digit Mobile Number</label>
            <input type="text" name="phone" required class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500" placeholder="e.g. 9876543210">
        </div>
        <div>
            <label data-key="auth_pass_label" class="block text-xs font-semibold text-gray-700 uppercase mb-1">Password</label>
            <input type="password" name="password" required class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500">
        </div>
        <button type="submit" data-key="auth_login_btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded text-sm transition">
            Login
        </button>
    </form>
    <p class="text-center text-xs text-gray-600 mt-4">
        <span data-key="auth_no_acc">Don't have an account?</span> 
        <a href="/register" data-key="auth_reg_here" class="text-blue-600 font-semibold hover:underline">Register here</a>
    </p>
</div>
{% endblock %}
